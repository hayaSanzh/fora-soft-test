# Конфигурация nginx для «Видеочат-комнаты» (задача IP 15.2, TDD §12.2).
#
# Роль nginx здесь ровно одна: TLS-терминация и корректный проброс WebSocket.
# Статику раздаёт сам Node (один origin — §12.2), поэтому отдельного root'а для
# файлов клиента здесь нет: дублирование путей к сборке — источник расхождений
# между тем, что проверено тестами, и тем, что отдаёт прод.
#
# ★ HTTPS не «желателен», а обязателен: без secure context браузер не даёт
# `getUserMedia` вовсе (единственное исключение — localhost). Приложение на
# http://<LAN-IP> покажет экран «страница открыта без HTTPS» (ФТ-36).
#
# Проверка синтаксиса без установки nginx:
#   docker run --rm -v "$PWD/deploy/nginx:/etc/nginx/conf.d:ro" nginx:alpine nginx -t

# ── Проброс заголовка Upgrade ────────────────────────────────────────────────
#
# ★ Значение `Connection` вычисляется через map, а не задаётся строкой
# `"upgrade"` намертво: при обычном HTTP-запросе к `/socket.io/` (например,
# health-проверка прокси) статичный `upgrade` заставил бы nginx закрывать
# keep-alive-соединения. Пустое значение в map означает `close` только для
# не-upgrade запросов.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream video_chat_app {
    # Один инстанс — требование архитектуры, а не временное упрощение: состояние
    # комнат живёт в RAM процесса (§9.4, §12.4). Добавление второго сервера в
    # этот upstream молча разведёт участников одной комнаты по разным процессам.
    server 127.0.0.1:3001;
    keepalive 32;
}

# ── HTTP: только редирект ────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name video-chat.example.com;

    # Единственное исключение из редиректа — ACME-проверка Let's Encrypt.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name video-chat.example.com;

    ssl_certificate     /etc/letsencrypt/live/video-chat.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/video-chat.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # CSP, X-Frame-Options и прочее выставляет приложение через helmet (§10.4):
    # дублировать их здесь нельзя — два источника истины разойдутся. HSTS —
    # исключение: это заголовок уровня транспорта, и его логично держать на
    # терминаторе TLS.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Медиа идёт P2P и через nginx не проходит вовсе. Загрузок нет — ограничение
    # тела запроса защищает от мусора, ничего не ломая.
    client_max_body_size 1m;

    # ── WebSocket сигналинга ─────────────────────────────────────────────────
    #
    # ★ Без двух строк Upgrade/Connection WebSocket **молча** не поднимется:
    # socket.io получит 400 на handshake, а пользователь увидит «Нет связи с
    # сервером». Симптом не отличим от лежащего приложения — поэтому это первое,
    # что нужно проверять при таком отчёте.
    location /socket.io/ {
        proxy_pass http://video_chat_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ★ Дефолтные 60 с рвут сигнальный сокет в тихом звонке: socket.io
        # пингует раз в 10 с, но между пингами трафика нет. Обрыв здесь
        # особенно неприятен, потому что auto-reconnect выключен по требованию
        # (ФТ-31) — участника выбросит на экран ошибки посреди разговора.
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;

        # Буферизация несовместима с WebSocket: кадры должны идти сразу.
        proxy_buffering off;
    }

    # ── /health: только изнутри ──────────────────────────────────────────────
    #
    # Приложение и само ограничивает доступ по адресу источника (Q11), но
    # полагаться на один слой нельзя: `TRUST_PROXY` и `X-Forwarded-For`
    # настраиваются, и ошибка в них открыла бы счётчики комнат наружу.
    location = /health {
        allow 127.0.0.1;
        allow ::1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        proxy_pass http://video_chat_app;
        proxy_set_header Host $host;
        access_log off;
    }

    # ── Приложение: статика и SPA-fallback ───────────────────────────────────
    #
    # Всё остальное отдаёт Node: он же обслуживает SPA-fallback, без которого
    # прямой переход по ссылке-приглашению `/:roomId` вернул бы 404.
    location / {
        proxy_pass http://video_chat_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }
}
